name: Avron
slug: avron
repository: rudractl/avron

description: >
  Declarative infrastructure automation for bootstrapping
  container-native environments from a single spec.

long_description: >
  Avron turns a single YAML spec into a fully provisioned environment —
  machines, container runtime, Kubernetes and the platform add-ons on top —
  with plans you can review before anything changes.

