name: Avron
slug: avron
repository: rudradevpal/avron
description: >
  A self-hosted gateway that strips personal data from outbound LLM traffic —
  your prompts reach the model, your customers' data doesn't.
long_description: >
  Avron finds personal data in outbound LLM requests, swaps each value for a
  stable stand-in the model can still reason about, and puts the real values
  back in the reply. One OpenAI-compatible endpoint, no client changes.
