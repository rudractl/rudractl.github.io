# Short intro (homepage + about hero)
intro: >
  10+ years building Kubernetes-based platforms across bare metal, private,
  public and hybrid cloud — from telecom edge to GPU and AI workloads.

# Longer narrative for /about. Markdown is supported.
summary: |
  I've spent the last decade in the layer between hardware and the teams that
  ship on it. Today that means building the **Kubernetes platform** (kubeadm,
  RKE2) underneath a scale-out storage system at Nasuni, with **one-touch
  upgrades** in Python and **GitOps delivery with Flux**.

  Before that I ran **GPU-optimized Kubernetes and OpenShift** for AI and LLM
  workloads at F5 — 24+ clusters, 355+ nodes, NVIDIA BlueField DPUs, disaster
  recovery with Velero and Kasten, and an observability stack built on
  Prometheus, Grafana and Thanos. Earlier stops: multi-cluster GKE with Istio at
  Netcracker, multi-site edge OpenShift at Verizon, and Kubernetes on OpenStack
  for NFV at TCS.

  The thread through all of it: automate the boring parts, make platforms
  reliable enough that nobody has to think about them, and write down what I
  learn along the way.

