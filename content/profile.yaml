# Short intro (homepage + about hero)
intro: >
  I enjoy building reliable infrastructure, Kubernetes platforms and
  automation that makes infrastructure easier to operate.

# Longer narrative for /about. Markdown is supported.
summary: |
  Most of my work lives in the layer between application teams and the
  machines they run on. I design and operate **Kubernetes platforms**, write
  the automation that provisions them, and spend a lot of time thinking about
  how to make that layer boring — in the best possible way.

  I care about declarative configuration, reproducible builds and systems
  that explain themselves when they fail. If a task is done twice, I want it
  in Git; if it is done three times, I want it automated.

  Outside of work I run a home lab, break clusters on purpose, and write
  about what I learn along the way.

