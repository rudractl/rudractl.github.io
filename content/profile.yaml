location: Hyderabad, India

# Short intro (homepage + about hero)
intro: >
  10+ years in Kubernetes, DevOps and infrastructure — building platforms
  across bare metal, cloud and edge, from telecom networks to AI workloads.

# Longer narrative for /about (the first paragraph also appears on the homepage).
# Keep it high level — tools and numbers belong in experience.yaml. Markdown is supported.
summary: |
  I'm a platform engineer who works in the layer between infrastructure and the
  teams that ship on it. I design and run **Kubernetes platforms**, automate
  everything that happens more than twice, and care a lot about **reliability**.

  Over the last decade that has meant AI and GPU infrastructure, large
  multi-cluster platforms, edge deployments for telecom, CI/CD and GitOps
  pipelines, disaster recovery and observability — on bare metal, private,
  public and hybrid cloud.

  The thread through all of it: automate the boring parts, make platforms
  reliable enough that nobody has to think about them, and write down what I
  learn along the way.

