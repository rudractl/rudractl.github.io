notes: |
  ## Topology

  ```text
           ┌──────── VIP 10.0.0.10 (keepalived) ────────┐
           ▼                    ▼                       ▼
     cp-1 (etcd)          cp-2 (etcd)             cp-3 (etcd)
           └──────────────┬─────────┴───────────────────┘
                          ▼
                 worker-1 … worker-n
  ```

  ## Experiments

  - Killed the etcd leader mid-deploy and measured API availability.
  - Rolled every control-plane node during an upgrade with zero failed requests.
  - Restored the cluster from an etcd snapshot onto fresh nodes.
