name: CI

# Every pull request (and every branch push) is validated end to end.
# Invalid content, type errors, broken links or failing tests block the merge.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  check:
    name: Validate · Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate content (YAML / front matter)
        run: npm run validate

      - name: JSON Schemas are up to date
        run: |
          npm run schemas
          git diff --exit-code -- schemas || (echo "::error::Run 'npm run schemas' and commit the result." && exit 1)

      - name: Lint (Prettier + markdownlint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build (+ GitHub stats, Medium posts, internal broken-link check)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests
        run: npm test

      - name: External link check
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true # external sites are flaky; report, don't block
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/site/dist" --exclude-path site/dist/api --exclude "linkedin.com" "site/dist/**/*.html"
          fail: true
