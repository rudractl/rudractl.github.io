name: Update dependencies

# Monthly: install safe (minor/patch) dependency updates, run the full check,
# and commit straight to main ONLY if everything passes. No pull requests.
# Major versions (e.g. TypeScript 7) are never applied automatically.
on:
  schedule:
    - cron: "0 4 1 * *" # 1st of every month, 09:30 IST
  workflow_dispatch:

permissions:
  contents: write # push the lockfile update
  actions: write # trigger the deploy workflow afterwards

concurrency:
  group: update-deps
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install current versions
        run: npm ci

      - name: Apply minor and patch updates (within package.json ranges)
        run: npm update

      - name: Anything to do?
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Everything is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            npm ls --depth=0 || true
          fi

      - name: Full check (validate · lint · typecheck · build · links · tests)
        if: steps.diff.outputs.changed == 'true'
        run: npm run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): monthly minor/patch updates"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Deploy
        if: steps.diff.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
